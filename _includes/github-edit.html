{% if site.repository %}
<div class="notice" style="margin-top: 1em; margin-bottom: 2em;">
  <a href="https://github.com{{ site.repository }}/edit/{{ site.git_branch | default: 'main' }}/{{ page.path }}" target="_blank" rel="noopener noreferrer" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-weight: bold;">
    <i class="fab fa-fw fa-github"></i> Edit this page on GitHub
  </a>
</div>
{% endif %}
