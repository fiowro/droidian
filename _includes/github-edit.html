{% if site.repository %}
<div class="toc-github-edit" style="margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid rgba(0,0,0,0.08);">
  <!-- FIXED: Replaced standard styles with built-in .btn framework classes -->
  <a href="https://github.com/{{ site.repository }}/edit/{{ site.git_branch | default: 'main' }}/{{ page.path }}" 
     target="_blank" 
     rel="noopener noreferrer" 
     class="btn btn--info btn--small" 
     style="display: block; text-align: center; margin: 0; font-weight: bold; font-size: 0.75em; padding: 0.4em 0.8em;">
    <i class="fab fa-fw fa-github"></i> Edit on GitHub
  </a>
</div>
{% endif %}
